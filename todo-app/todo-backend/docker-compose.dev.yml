services:
  mongo:
    image: initialized-mongo
    ports:
      - 3456:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:z
      - ./mongo_data:/data/db
  redis:
    image: redis:8.0
    ports:
      - 6379:6379
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./redis_data:/data

  server:
    image: hello-back-dev
    build:
      context: .
      dockerfile: dev.Dockerfile
    volumes: 
      - ./:/usr/src/app:z
    ports:
      - 3000:3000
    environment:
      - REDIS_URL=redis://localhost:6379
      - MONGO_URL=mongodb://the_username:the_password@localhost:27017/the_database
    container_name: hello-back-dev

  debug-helper:
    image: busybox

volumes:
  mongo_data:
  redis_data:
