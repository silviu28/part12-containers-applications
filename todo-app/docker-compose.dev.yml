# this is the development compose - runs all containers in development mode (with HMR, realod on refresh, etc.)
services:
  # server
  mongo:
    image: initialized-mongo
    ports:
      - 3456:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ./todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:z
      - ./todo-backend/mongo_data:/data/db:z
  
  redis:
    image: redis:8.0
    ports:
      - 6379:6379
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./todo-backend/redis_data:/data:z
  
  server:
    image: hello-back-dev
    build:
      context: ./todo-backend
      dockerfile: dev.Dockerfile
    volumes: 
      - ./todo-backend:/usr/src/app:z
    ports:
      - 3000:3000
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://the_username:the_password@mongo:27017/the_database  # Use service name 'mongo'
    container_name: hello-back-dev
    depends_on:
      - mongo
      - redis
  
  # frontend
  app:
    image: hello-front-dev
    build:
      context: ./todo-frontend
      dockerfile: dev.Dockerfile
    volumes:
      - ./todo-frontend:/usr/src/app:z
    ports:
      - 3210:5173
    container_name: hello-front-dev
  
  # reverse proxy
  nginx:
    image: nginx:1.29.4
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro,z
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app
      - server