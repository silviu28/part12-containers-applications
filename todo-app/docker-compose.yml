# this is the production compose - runs all containers in production mode
services:
  mongo:
    image: initialized-mongo
    ports: 
      - 3456:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ./todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongoinit.js:z
      - ./todo-backend/mongo_data:/data/db:z

  redis:
    image: redis:8.0
    ports:
      - 6379:6379
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./todo-backend/redis_data:/data:z

  server:
    image: hello-back
    build:
      context: ./todo-backend
      dockerfile: Dockerfile
    volumes:
      - ./todo-backend:/usr/src/app:z
    ports:
      - 3000:3000
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://the_username:the_password@mongo:27017/the_database
    container_name: hello-back
    depends_on:
      - mongo
      - redis

  app:
    image: hello-front
    build:
      context: ./todo-frontend
      dockerfile: Dockerfile
    volumes:
      - ./todo-frontend:/usr/src/app:z
    ports:
      - 3210:5173
    container_name: hello-front

  nginx:
    image: nginx:1.29.4
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app
      - server